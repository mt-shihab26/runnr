name: Format

on:
  push:
  pull_request:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    # Arch, like the development machines, so CI gets the same clang-format version.
    container: archlinux:latest
    # Lets the commit step push the formatting fix.
    permissions:
      contents: write
    steps:
      - name: Install clang-format and git
        run: pacman -Syu --noconfirm --needed clang git

      # On pull requests check out the branch itself, not the merge commit, so the fix can be pushed to it.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      # Only our sources, vendor/ keeps its upstream formatting.
      - name: Format code
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -z 'src/*.cpp' 'src/*.hpp' | xargs -0 clang-format -i

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: fix code style
          commit_options: "--no-verify"
